[shader]
name = "Detail Map Merger"
description = "Blends detail map into base colour using linear light blending with mask support"
author = "echo000"
version = "1.2.0"

[[inputs]]
suffix = "_c"
description = "Base colour map (required)"
required = true

[[inputs]]
suffix = "_d"
description = "Detail map (required)"
required = true
address_mode = "repeat"

[[parameters]]
name = "detail_intensity"
type = "float"
default = 0.5
min = 0.0
max = 1.0
description = "Detail Intensity"

[[parameters]]
name = "detail_tiling_x"
type = "float"
control = "text"
default = 1.0
min = -64.0
max = 64.0
description = "Detail Tiling X"

[[parameters]]
name = "detail_tiling_y"
type = "float"
control = "text"
default = 1.0
min = -64.0
max = 64.0
description = "Detail Tiling Y"

[[outputs]]
entry_point = "fs_main"
suffix = "_detailed"
description = "Colour map"
format = "Rgba8Unorm"
