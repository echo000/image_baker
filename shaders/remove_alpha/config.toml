[shader]
name = "Remove Alpha"
description = "Removes alpha channel from a texture"
author = "echo000"
version = "1.0.0"

[[inputs]]
suffix = "_input"
description = "Input texture (required)"
required = true

[[outputs]]
entry_point = "fs_main"
suffix = "_converted"
description = "Converted output"
format = "Rgba8Unorm"
