[package]
name = "texture_smith_core"
version = "0.1.3"
edition = "2024"
authors = ["echo000"]
description = "Core image processing library for texture merging and baking"
license = "GPL-3.0"
repository = "https://github.com/echo000/texture_smith"
keywords = ["texture", "image", "graphics", "baking"]
categories = ["graphics", "multimedia::images"]

[lib]
name = "texture_smith_core"

[dependencies]
porter-gpu = { git = "https://github.com/dtzxporter/porter-lib" }
porter-texture = { git = "https://github.com/dtzxporter/porter-lib" }
wgpu = { version = "26.0", default-features = false, features = ["wgsl", "metal", "vulkan"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
pollster = "0.3"
futures = "0.3"
intel_tex_2 = "0.3"
