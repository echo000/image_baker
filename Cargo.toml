[workspace]
members = [
    "crates/texture_smith_core",
    "crates/texture_smith_ui",
]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
authors = ["echo000"]
license = "GPL-3.0"
repository = "https://github.com/echo000/texture_smith"

[profile.dev]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
iced = { git = "https://github.com/dtzxporter/iced", rev = "d993b7da9809fe6c19ade6c0e776787c65d3b72e" }
